<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f7ef" />
    <title>学生课堂 · EduMind · 随堂三问</title>
    <link rel="icon" href="/brand.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/student.css" />
    <link rel="stylesheet" href="/stack-lab.css" />
    <script type="module" src="/stack-lab.js"></script>
    <script defer src="/student.js"></script>
  </head>
  <body>
    <main class="phone">
      <header class="brandbar">
        <a class="brand" href="/" aria-label="返回 EduMind 工作台">
          <img src="/brand.svg" width="32" height="32" alt="" />
          <b><span class="latinmark">EduMind</span> · 随堂三问</b>
          <span class="brand-divider"></span><span class="role">学生端</span>
        </a>
        <span id="session-tag" class="session-tag" hidden></span>
      </header>
      <div id="network" class="network" role="status" hidden></div>
      <div id="screen" aria-busy="true">
        <section class="start-state">
          <span class="loader" aria-hidden="true"></span>
          <h1>正在加入课堂</h1>
          <p>正在获取本次课堂的题目。</p>
        </section>
      </div>
      <section id="student-attendance"></section>
      <a class="back-workspace" href="/#home">返回学生工作台</a>
      <p id="announcement" class="sr" role="status" aria-live="polite"></p>
      <noscript
        >请在浏览器中启用 JavaScript，以便提交和接收老师的巩固题。</noscript
      >
      <dialog id="course-desk" aria-labelledby="resource-title">
        <header class="resource-head">
          <h2 id="resource-title">课堂资料</h2>
          <button id="leave-resource" class="resource-close" type="button">
            关闭
          </button>
        </header>
        <div class="resource-tabs" aria-label="课堂资料栏目">
          <button type="button" data-resource-tab="live" aria-pressed="false">
            当前授课页
          </button>
          <button type="button" data-resource-tab="reading" aria-pressed="true">
            课程讲义
          </button>
          <button type="button" data-resource-tab="asking" aria-pressed="false">
            讲义答疑
          </button>
        </div>
        <section id="live" aria-label="跟随授课页" hidden></section>
        <section id="reading" aria-label="课程讲义">
          <h3 id="reading-title"></h3>
          <p id="reading-material"></p>
        </section>
        <section id="asking" aria-label="讲义答疑" hidden>
          <form id="ask-form">
            <label for="course-question">你对讲义中的哪一处有疑问？</label>
            <textarea
              id="course-question"
              maxlength="300"
              rows="3"
              placeholder="输入概念、条件或想弄清的一步"
              required
            ></textarea>
            <button class="primary" id="ask-submit" type="submit">
              根据讲义回答
            </button>
          </form>
          <div id="ask-result" role="status" aria-live="polite"></div>
        </section>
      </dialog>
    </main>
  </body>
</html>
